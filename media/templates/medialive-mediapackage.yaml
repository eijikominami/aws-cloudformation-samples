AWSTemplateFormatVersion: 2010-09-09
Transform: AWS::Serverless-2016-10-31
Description: AWSCloudFormationSamples/media/medialive-mediapackage creates an environment for live streaming.

Metadata: 
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: 
          default: 'MediaLive Input Configuration'
        Parameters:
          - InputType
          - ElementalLinkId1
          - ElementalLinkId2
          - StreamKey
          - VodSourceBucket
      - Label: 
          default: 'MediaLive Configuration'
        Parameters: 
          - AudioBitrate 
          - AutoInputFailover
          - ChannelClass
          - FramerateDenominator
          - FramerateNumerator
          - GopNumBFrames
          - GopSize
          - H264Profile
          - H264Level
          - Height
          - VideoBitrate
          - Width
          - WhitelistRules
      - Label:
          default: 'Elemental Inference Configuration'
        Parameters:
          - EventClipping
          - SmartCrop
          - SmartCropHeight
          - SmartCropWidth
          - SmartSubtitles
          - SmartSubtitlesLanguage
          - SmartSubtitlesProfanityFilter
      - Label: 
          default: 'MediaPackage Configuration'
        Parameters: 
          - MediaPackageOutputType
          - StartoverWindowSeconds
          - SegmentDurationSeconds
      - Label: 
          default: 'RTMP output Configuration'
        Parameters: 
          - RtmpUrl1
          - RtmpStreamKey1
          - RtmpUrl2
          - RtmpStreamKey2
      - Label:
          default: 'Slack Configuration'
        Parameters: 
          - SlackWorkspaceId
          - SlackChannelId
      - Label: 
          default: 'Tag Configuration'
        Parameters:
          - Environment
          - TagKey
          - TagValue

Parameters:
  AudioBitrate:
    Type: Number
    Default: 96000
    Description: Average audio bitrate in bits/second [required]
  AutoInputFailover:
    Type: String
    AllowedValues:
      - ENABLED
      - DISABLED  
    Default: ENABLED
    Description: Enable or disable automatic input failover [required]
  ChannelClass:
    Type: String
    AllowedValues:
      - STANDARD
      - SINGLE_PIPELINE  
    Default: STANDARD
    Description: Select the class of channel you intend to attach this input to [required]
  ElementalLinkId1:
    Type: String
    Default: ''
    Description: The unique ID for the Elemental Link device [conditional]  
  ElementalLinkId2:
    Type: String
    Default: ''
    Description: The unique ID for the Elemental Link device [conditional]
  EventClipping:
    Type: String
    Default: DISABLED
    AllowedValues:
      - ENABLED
      - DISABLED
    Description: Enable or disable the event clipping of Elemental Inference [required]
  FramerateDenominator:
    Type: Number
    Default: 1001
    Description: Framerate denominator [required]
  FramerateNumerator:
    Type: Number
    Default: 30000
    Description: Framerate numerator [required]  
  GopNumBFrames:
    Type: Number
    Default: 3
    Description: Number of B-frames between reference frames [required]
  GopSize:
    Type: Number
    Default: 60
    Description: GOP size (keyframe interval) in units of either frames or seconds per gopSizeUnits [required]
  H264Profile:
    Type: String
    AllowedValues:
      - BASELINE
      - HIGH
      - HIGH_10BIT
      - HIGH_422
      - HIGH_422_10BIT
      - MAIN
    Default: HIGH
    Description: H.264 Profile [required]
  H264Level:
    Type: String
    AllowedValues:
      - H264_LEVEL_1
      - H264_LEVEL_1_1
      - H264_LEVEL_1_2
      - H264_LEVEL_1_3
      - H264_LEVEL_2
      - H264_LEVEL_2_1
      - H264_LEVEL_2_2
      - H264_LEVEL_3
      - H264_LEVEL_3_1
      - H264_LEVEL_3_2
      - H264_LEVEL_4
      - H264_LEVEL_4_1
      - H264_LEVEL_4_2
      - H264_LEVEL_5
      - H264_LEVEL_5_1
      - H264_LEVEL_5_2
      - H264_LEVEL_AUTO
    Default: H264_LEVEL_4_1
    Description: H.264 Level [required]
  Height:
    Type: Number
    Default: 540
    Description: Output video height, in pixels [required]
  InputType:
    Type: String
    Default: RTMP
    AllowedValues:
      - RTMP
      - RTMP_S3
      - ELEMENTAL_LINK
      - ELEMENTAL_LINK_S3
      - S3
    Description: The input type [required]
  LiveToVod:
    Type: String
    AllowedValues:
      - REC_ON_MEDIALIVE
      - REC_ON_MEDIAPACKAGE
      - PLAY_ON_MEDIALIVE
      - PLAY_ON_MEDIAPACKAGE
      - NONE 
    Default: NONE
    Description: Mediapackage OutputType [required]    
  MediaPackageOutputType:
    Type: String
    AllowedValues:
      - APPLE_HLS
      - ISO_DASH
      - ALL  
    Default: APPLE_HLS
    Description: Mediapackage OutputType [required]   
  RtmpUrl1:
    Type: String
    Default: ''
    Description: The rtmp url a stream sends to
  RtmpStreamKey1:
    Type: String
    Default: ''
    Description: The rtmp stream name a stream sends to
  RtmpUrl2:
    Type: String
    Default: ''
    Description: The rtmp url a stream sends to
  RtmpStreamKey2:
    Type: String
    Default: ''
    Description: The rtmp stream name a stream sends to
  SmartCrop:
    Type: String
    Default: DISABLED
    AllowedValues:
      - ENABLED
      - DISABLED
    Description: Enable or disable the smart crop of Elemental Inference [required]
  SmartCropHeight:
    Type: Number
    Default: 960
    Description: Smart crop output video height, in pixels [required]
  SmartCropWidth:
    Type: Number
    Default: 540
    Description: Smart crop output video width, in pixels [required]
  SmartSubtitles:
    Type: String
    Default: DISABLED
    AllowedValues:
      - ENABLED
      - DISABLED
    Description: Enable or disable the smart subtitles of Elemental Inference [required]
  SmartSubtitlesLanguage:
    Type: String
    Default: eng
    AllowedValues:
      - eng
      - spa
      - fra
      - deu
      - ita
      - por
    Description: The language of the source audio [required]
  SmartSubtitlesProfanityFilter:
    Type: String
    Default: DISABLED
    AllowedValues:
      - DISABLED
      - CENSOR
      - DROP
    Description: How profanity in the subtitles is handled [required]
  SlackChannelId:
    Type: String
    Default: ''
    Description: Slack Channel Id
  SlackWorkspaceId:
    Type: String
    Default: ''
    Description: Slack Workspace Id
  StartoverWindowSeconds:
    Type: Number
    Default: 0
    Description: Maximum duration seconds of content to retain for startover playback [required]
    MinValue: 0
  SegmentDurationSeconds:
    Type: String
    Default: 3
    Description: Duration (in seconds) of each fragment [required]
  StreamKey:
    Type: String
    Default: stream
    Description: A unique name for the location the RTMP stream is being pushed to [conditional]
  VideoBitrate:
    Type: Number
    Default: 2200000
    Description: Average video bitrate in bits/second [required]
  VodSourceBucket:
    Type: String
    Default: ''
    Description: The S3 bucket Name VOD contents exist [conditional]  
  Width:
    Type: Number
    Default: 960
    Description: Output video width, in pixels [required]
  WhitelistRules:
    Type: String
    AllowedPattern: ^[0-9./]*$
    Default: 0.0.0.0/0
    Description: A list of one or more IPv4 CIDR addresses to allow (e.g. 0.0.0.0/0) [required]
  Environment:
    Type: String
    Default: development
    AllowedValues:
      - production
      - test
      - development
  TagKey:
    Type: String
    Default: createdby
    AllowedPattern: .+
  TagValue:
    Type: String
    Default: aws-cloudformation-samples 
    AllowedPattern: .+

Conditions:
  CreateElementalInference: !Or [ !Equals [ !Ref EventClipping, ENABLED ], !Equals [ !Ref SmartCrop, ENABLED ], !Equals [ !Ref SmartSubtitles, ENABLED ] ]
  CreateSlack: !And [ !Not [ !Equals [ !Ref SlackChannelId, '' ] ], !Not [ !Equals [ !Ref SlackWorkspaceId, '' ] ] ]
  Development: !Equals [ !Ref Environment, development]
  RecOnMediaLive: !And [ !Equals [ !Ref LiveToVod, REC_ON_MEDIALIVE ], !Not [ !Equals [ !Ref VodSourceBucket, '' ] ] ]
  RecOnMediaPackage: !And [ !Equals [ !Ref LiveToVod, REC_ON_MEDIAPACKAGE ], !Not [ !Equals [ !Ref VodSourceBucket, '' ] ] ]
  PlayOnMediaLive: !And [ !Equals [ !Ref LiveToVod, PLAY_ON_MEDIALIVE ], !Not [ !Equals [ !Ref VodSourceBucket, '' ] ] ]
  PlayOnMediaPackage: !And [ !Equals [ !Ref LiveToVod, PLAY_ON_MEDIAPACKAGE ], !Not [ !Equals [ !Ref VodSourceBucket, '' ] ] ]

Resources:
  # Nested Stack
  ElementalInference:
    Condition: CreateElementalInference
    Type: AWS::CloudFormation::Stack
    Properties:
      NotificationARNs:
        - !GetAtt SNSForDeployment.Outputs.SNSTopicArn
      Parameters:
        EventClipping: !Ref EventClipping
        SmartCrop: !Ref SmartCrop
        SmartSubtitles: !Ref SmartSubtitles
        SmartSubtitlesLanguage: !Ref SmartSubtitlesLanguage
        SmartSubtitlesProfanityFilter: !Ref SmartSubtitlesProfanityFilter
        LogicalName: !Ref AWS::StackName
        Environment: !Ref Environment
        TagValue: !Ref TagValue
      TemplateURL: !If
        - Development
        - https://eijikominami-test.s3-ap-northeast-1.amazonaws.com/aws-cloudformation-templates/media/elementalinference.yaml
        - https://eijikominami.s3-ap-northeast-1.amazonaws.com/aws-cloudformation-templates/media/elementalinference.yaml
      Tags:
        - Key: environment
          Value: !Ref Environment
        - Key: !Ref TagKey
          Value: !Ref TagValue
  MediaLive:
    Type: AWS::CloudFormation::Stack
    Properties:
      NotificationARNs:
        - !GetAtt SNSForDeployment.Outputs.SNSTopicArn
      Parameters:
        ArchiveBucket: !If
          - RecOnMediaLive
          - !Ref VodSourceBucket
          - ''
        AutoInputFailover: !Ref AutoInputFailover
        AudioBitrate: !Ref AudioBitrate
        ChannelClass: !Ref ChannelClass
        ElementalLinkId1: !Ref ElementalLinkId1
        ElementalLinkId2: !Ref ElementalLinkId2
        FramerateDenominator: !Ref FramerateDenominator
        FramerateNumerator: !Ref FramerateNumerator
        GopNumBFrames: !Ref GopNumBFrames
        GopSize: !Ref GopSize
        H264Profile: !Ref H264Profile
        H264Level: !Ref H264Level
        Height: !Ref Height
        InferenceFeedArn: !If
          - CreateElementalInference
          - !GetAtt ElementalInference.Outputs.FeedArn
          - ''
        InputType: !Ref InputType
        InputStreamKey: !Ref StreamKey
        InputWhitelistRules: !Ref WhitelistRules
        MediaPackageChannelId: !GetAtt MediaPackage.Outputs.ChannelId
        LogicalName: !Ref AWS::StackName
        OutputType: MEDIA_PACKAGE
        OutputRtmpRtpUrl1: !Ref RtmpUrl1
        OutputRtmpStreamKey1: !Ref RtmpStreamKey1
        OutputRtmpRtpUrl2: !Ref RtmpUrl2
        OutputRtmpStreamKey2: !Ref RtmpStreamKey2
        SmartCrop: !Ref SmartCrop
        SmartCropHeight: !Ref SmartCropHeight
        SmartCropWidth: !Ref SmartCropWidth
        SmartSubtitles: !Ref SmartSubtitles
        SmartSubtitlesFeedOutput: !If
          - CreateElementalInference
          - !GetAtt ElementalInference.Outputs.SmartSubtitlesOutputName
          - !Sub subtitling-${SmartSubtitlesLanguage}
        SmartSubtitlesLanguage: !Ref SmartSubtitlesLanguage
        VideoBitrate: !Ref VideoBitrate
        VodSourceBucket: !If
          - PlayOnMediaLive
          - !Ref VodSourceBucket
          - ''
        Width: !Ref Width
        SNSForAlertArn: !GetAtt SNSForAlert.Outputs.SNSTopicArn
        SNSForDeploymentArn: !GetAtt SNSForDeployment.Outputs.SNSTopicArn
        Environment: !Ref Environment
        TagKey: !Ref TagKey
        TagValue: !Ref TagValue
      TemplateURL: !If
        - Development
        - https://eijikominami-test.s3-ap-northeast-1.amazonaws.com/aws-cloudformation-templates/media/medialive.yaml
        - https://eijikominami.s3-ap-northeast-1.amazonaws.com/aws-cloudformation-templates/media/medialive.yaml
      Tags:
        - Key: environment
          Value: !Ref Environment
        - Key: !Ref TagKey
          Value: !Ref TagValue
  MediaPackage:
    Type: AWS::CloudFormation::Stack
    Properties:
      NotificationARNs:
        - !GetAtt SNSForDeployment.Outputs.SNSTopicArn
      Parameters: 
        ArchiveBucket: !If
          - RecOnMediaPackage
          - !Ref VodSourceBucket
          - ''
        LogicalName: !Ref AWS::StackName
        OutputType: !Ref MediaPackageOutputType
        StartoverWindowSeconds: !Ref StartoverWindowSeconds
        SegmentDurationSeconds: !Ref SegmentDurationSeconds
        VodSourceBucket: !If
          - PlayOnMediaPackage
          - !Ref VodSourceBucket
          - ''
        Environment: !Ref Environment
        TagKey: !Ref TagKey
        TagValue: !Ref TagValue
      TemplateURL: !If
        - Development 
        - https://eijikominami-test.s3-ap-northeast-1.amazonaws.com/aws-cloudformation-templates/media/mediapackage.yaml
        - https://eijikominami.s3-ap-northeast-1.amazonaws.com/aws-cloudformation-templates/media/mediapackage.yaml
      Tags:
        - Key: environment
          Value: !Ref Environment
        - Key: !Ref TagKey
          Value: !Ref TagValue
  Slack:
    Condition: CreateSlack
    Type: AWS::CloudFormation::Stack
    Properties:
      NotificationARNs:
        - !GetAtt SNSForDeployment.Outputs.SNSTopicArn
      Parameters:
        SlackChannelIdForAlert: !Ref SlackChannelId
        SlackWorkspaceId: !Ref SlackWorkspaceId
        SNSForAlertArn: !GetAtt SNSForAlert.Outputs.SNSTopicArn
        TagEventsRule: DISABLED
      TemplateURL: !If
        - Development
        - https://eijikominami-test.s3-ap-northeast-1.amazonaws.com/aws-cloudformation-templates/notification/packaged.yaml
        - https://eijikominami.s3-ap-northeast-1.amazonaws.com/aws-cloudformation-templates/notification/packaged.yaml
      Tags:
        - Key: environment
          Value: !Ref Environment
        - Key: !Ref TagKey
          Value: !Ref TagValue
  SNSForAlert:
    Type: AWS::Serverless::Application
    Properties:
      Location:
        ApplicationId: arn:aws:serverlessrepo:us-east-1:172664222583:applications/sns-topic
        SemanticVersion: 2.2.13
      NotificationARNs:
        - !GetAtt SNSForDeployment.Outputs.SNSTopicArn
      Parameters:
        TopicName: !Sub Alert-createdby-${AWS::StackName}
      Tags:
        environment: !Ref Environment
        createdby: !Ref TagValue
  SNSForDeployment:
    Type: AWS::Serverless::Application
    Properties:
      Location:
        ApplicationId: arn:aws:serverlessrepo:us-east-1:172664222583:applications/sns-topic
        SemanticVersion: 2.2.13
      Parameters:
        TopicName: !Sub Deployment-createdby-${AWS::StackName}
      Tags:
        environment: !Ref Environment
        createdby: !Ref TagValue

Outputs:
  DashEndpointUrl:
    Description: Apple HLS Endpoint Url
    Value: !Join
      - ''
      - - !GetAtt MediaPackage.Outputs.DashEndpointUrl
        - !GetAtt MediaPackage.Outputs.ManifestFile
  HlsEndpointUrl:
    Description: ISO-DASH Endpoint Url
    Value:  !Join
      - ''
      - - !GetAtt MediaPackage.Outputs.HlsEndpointUrl
        - !GetAtt MediaPackage.Outputs.ManifestFile
  MediaLiveChannelId:
    Description: MediaLive Channel Id
    Value: !GetAtt MediaLive.Outputs.ChannelId
  MediaPackageChannelId:
    Description: MediaPackage Channel Id
    Value: !GetAtt MediaPackage.Outputs.ChannelId
  RtmpPrimary1:
    Description: The RTMP primary address 1
    Value: !GetAtt MediaLive.Outputs.RtmpPrimary1
  RtmpPrimary2:
    Description: The RTMP primary address 2
    Value: !GetAtt MediaLive.Outputs.RtmpPrimary2
  RtmpSecondary1:
    Description: The RTMP secondary address 1
    Value: !GetAtt MediaLive.Outputs.RtmpSecondary1
  RtmpSecondary2:
    Description: The RTMP secondary address 2
    Value: !GetAtt MediaLive.Outputs.RtmpSecondary2
  ElementalInferenceFeedArn:
    Condition: CreateElementalInference
    Description: The Elemental Inference feed ARN
    Value: !GetAtt ElementalInference.Outputs.FeedArn